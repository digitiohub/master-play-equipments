# Local / Coolify "Docker Compose" deployment. In Coolify, set the env vars in the UI and
# add a persistent storage entry for /data/uploads (and mongo_data) — see README.
services:
  web:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/masterplay}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]
    depends_on: [mongo]
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo_data:/data/db"]
volumes:
  uploads:
  mongo_data:
